spring.application.name=urbanbasket-backend

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/urbanbasket_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT Configuration (256-bit secret key)
urbanbasket.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
urbanbasket.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Initial Admin bootstrap credentials
urbanbasket.bootstrap.admin.email=${ADMIN_EMAIL:admin@urbanbasket.com}
urbanbasket.bootstrap.admin.password=${ADMIN_PASSWORD:Admin@123}
urbanbasket.bootstrap.admin.fullName=${ADMIN_NAME:System Administrator}

# Swagger UI / OpenAPI configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
